<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>SPINDLE · PM tower</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧵</text></svg>">
<style>
/* =============================================================================
   SPINDLE · PM tower — "loom control-room at night"
   A dim ops room, cool indigo substrate, one warm spun-copper thread accent.
   Token NAMES are held stable so the untouched JS (var(--purple)/var(--dim)
   in the sparkline SVG) keeps resolving; only their VALUES are re-tuned.
   ============================================================================= */
:root {
  color-scheme: dark;

  /* — substrate & ink — */
  --bg:     #0B0F1A;   /* warp   — midnight-indigo substrate            */
  --panel:  #141B2B;   /* loom   — a lit console panel                  */
  --panel2: #0E1422;   /* well   — recessed track / thread groove       */
  --line:   #26314A;   /* reed   — cool hairline                        */
  --fg:     #D9E0F0;   /* linen  — primary ink                          */
  --dim:    #7C89A6;   /* flax   — muted label ink                      */

  /* — status family (disciplined, one job each) — */
  --info:   #6E8BD6;   /* weft periwinkle — building / active / calm    */
  --ok:     #5DBE9A;   /* spun jade       — merged / done / healthy     */
  --warn:   #E0A93C;   /* amber           — waiting / hot / stale       */
  --bad:    #E8686B;   /* alarm           — gate open / stalled / down  */

  /* — THE accent: spun copper thread. Held in --purple because the JS
       sparkline hardcodes stroke="var(--purple)". One accent, used sparingly. */
  --purple: #EA8B57;
  --copper: #EA8B57;
  --copper-deep: #B0592A;
  --copper-hi:   #F5B183;
  --copper-glow: rgba(234,139,87,.30);

  /* — model-family hues for the routing loom (theme-aware) — */
  --fable:  #B58BE6;   /* fable violet   — the MAX co-plan drafter        */
  --sonnet: #8AA6E6;   /* sonnet weft    — lighter than opus periwinkle   */
  --sol:    #E7A24A;   /* codex sol gold — deep, vs terra's copper        */
  --glm:    #9B8CFF;   /* glm violet     — distinct from codex/claude/sol  */
  --deepseek: #4FA8E0;  /* deepseek blue  — 4th pool, spend-down balance   */

  --mono: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, monospace;
  --disp: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  /* — type scale — */
  --fs-eyebrow: 10.5px;
  --fs-cap:     11.5px;
  --fs-meta:    12.5px;
  --fs-body:    13.5px;
  --fs-lead:    15px;
  --fs-logo:    15px;
  --fs-h2:      20px;

  /* — rhythm — */
  --r:    13px;
  --r-sm: 9px;
  --r-xs: 6px;
  --sh:   0 10px 30px -22px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.03) inset;
  --sh-lift: 0 16px 34px -20px rgba(0,0,0,.95), 0 0 0 1px color-mix(in srgb, var(--copper) 30%, transparent);
}

@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    /* "day workshop" — cool paper, not cream; same copper thread */
    --bg:     #E6E9F1;
    --panel:  #FBFCFE;
    --panel2: #EDF0F7;
    --line:   #CCD4E4;
    --fg:     #1A2030;
    --dim:    #5C6884;

    --info:   #3D5EA8;
    --ok:     #1F8F68;
    --warn:   #B27A16;
    --bad:    #CB4A4D;

    --purple: #C0692E;
    --copper: #C0692E;
    --copper-deep: #9A501F;
    --copper-hi:   #DA8A4C;
    --copper-glow: rgba(192,105,46,.24);

    --fable:  #7E56C0;
    --sonnet: #4E6DBE;
    --sol:    #C07A22;
    --glm:    #6E5AE0;
    --deepseek: #2C7FB8;

    --sh: 0 10px 26px -22px rgba(24,34,64,.55), 0 1px 0 rgba(255,255,255,.7) inset;
    --sh-lift: 0 16px 30px -20px rgba(24,34,64,.5), 0 0 0 1px color-mix(in srgb, var(--copper) 34%, transparent);
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  color: var(--fg);
  font: var(--fs-body)/1.5 var(--disp);
  font-variant-numeric: tabular-nums;
  -webkit-text-size-adjust: 100%;
  background:
    radial-gradient(130% 90% at 50% -12%, color-mix(in srgb, var(--info) 9%, var(--bg)) 0%, var(--bg) 58%),
    var(--bg);
  min-height: 100vh;
}

a { color: var(--copper); text-underline-offset: 2px; }

/* ---- header : the persistent brand moment + spun-thread hairline ------------ */
header {
  display: flex; align-items: center; gap: .7rem;
  padding: .55rem .8rem;
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
/* the thread: a fine copper filament strung under the whole console */
header::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg,
    transparent 0, transparent 4%,
    color-mix(in srgb, var(--copper) 55%, transparent) 18%,
    color-mix(in srgb, var(--copper) 20%, transparent) 50%,
    color-mix(in srgb, var(--copper) 55%, transparent) 82%,
    transparent 96%);
}
.logo {
  font-weight: 800; font-size: var(--fs-logo); letter-spacing: .1em;
  white-space: nowrap; text-transform: uppercase; color: var(--fg);
}
nav { display: flex; gap: .2rem; overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav button {
  background: none; border: 1px solid transparent; color: var(--dim);
  padding: .35rem .7rem; border-radius: var(--r-sm); cursor: pointer;
  font-family: var(--disp); font-size: 12px; font-weight: 600;
  letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;
  position: relative; transition: color .18s ease, background .18s ease;
}
nav button:hover { color: var(--fg); }
nav button.active { color: var(--fg); background: color-mix(in srgb, var(--copper) 8%, transparent); }
/* active tab hangs a short copper thread */
nav button.active::after {
  content: ""; position: absolute; left: 22%; right: 22%; bottom: -.4rem; height: 2px;
  border-radius: 2px; background: var(--copper);
  box-shadow: 0 0 8px var(--copper-glow);
}
.badge {
  background: var(--bad); color: #0B0F1A; border-radius: 999px;
  padding: .05em .45em; font-size: 10px; font-weight: 800; font-family: var(--mono);
  vertical-align: top; margin-left: .3em;
}

.conn {
  margin-left: auto; font-size: var(--fs-cap); color: var(--bad);
  display: flex; align-items: center; gap: .4rem; white-space: nowrap;
  text-transform: uppercase; letter-spacing: .08em; font-weight: 600;
}
.conn .dot2 { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
.conn.on { color: var(--ok); }
.conn.on .dot2 {
  background: var(--ok);
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent);
  animation: beacon 2.6s ease-out infinite;
}

main { padding: .9rem; max-width: 1120px; margin: 0 auto; }

/* ---- section headings : eyebrow with a copper thread-tick ------------------- */
h2 { font-size: var(--fs-h2); font-weight: 750; letter-spacing: -.01em; margin: 0 0 .7rem; }
h3 {
  margin: 0 0 .6rem; font-size: var(--fs-eyebrow); color: var(--dim);
  text-transform: uppercase; letter-spacing: .16em; font-weight: 700;
  display: flex; align-items: center; gap: .5rem;
}
.panel > h3::before {
  content: ""; width: 12px; height: 2px; border-radius: 2px; flex: none;
  background: var(--copper); box-shadow: 0 0 6px var(--copper-glow);
}
.dim { color: var(--dim); }
.mult { color: var(--sol); font-weight: 700; font-family: var(--mono); font-size: .92em; }
.fg  { color: var(--fg); }
.good { color: var(--ok); }
.bad  { color: var(--bad); }
.note { color: var(--dim); font-size: var(--fs-cap); margin-top: .55rem; font-style: italic; }

/* ---- banners --------------------------------------------------------------- */
.stale-banner, .gate-banner {
  border-radius: var(--r); padding: .65rem .85rem; margin-bottom: .8rem;
  font-size: var(--fs-meta); line-height: 1.45; box-shadow: var(--sh);
}
.stale-banner {
  background: color-mix(in srgb, var(--warn) 15%, var(--panel));
  border: 1px solid color-mix(in srgb, var(--warn) 55%, var(--line));
}
.gate-banner {
  background: color-mix(in srgb, var(--bad) 15%, var(--panel));
  border: 1px solid color-mix(in srgb, var(--bad) 60%, var(--line));
  color: color-mix(in srgb, var(--bad) 30%, var(--fg));
}
.gate-banner b { color: var(--fg); }

/* ---- panels ---------------------------------------------------------------- */
.panel {
  background: linear-gradient(180deg, color-mix(in srgb, var(--fg) 2.5%, var(--panel)) 0, var(--panel) 40%);
  border: 1px solid var(--line); border-radius: var(--r);
  padding: .9rem 1rem; margin-bottom: .8rem; box-shadow: var(--sh);
}
.panel.wide { grid-column: 1 / -1; }
.panels { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
@media (max-width: 760px) { .panels { grid-template-columns: 1fr; } }

/* ---- key/value rows -------------------------------------------------------- */
.kv { display: flex; flex-wrap: wrap; gap: .35rem 1.3rem; font-size: var(--fs-meta); color: var(--dim); }
.kv > span { display: inline-flex; align-items: baseline; gap: .4ch; }
.kv b { color: var(--fg); font-weight: 700; font-variant-numeric: tabular-nums; }
.kv b.good { color: var(--ok); }
.kv b.bad  { color: var(--bad); }

/* ---- chips (daemons, eligible, fences) ------------------------------------- */
.chips { display: flex; flex-wrap: wrap; gap: .35rem; }
.chip {
  display: inline-flex; align-items: center; gap: .4rem;
  background: var(--panel2); border: 1px solid var(--line); border-radius: 999px;
  padding: .18rem .65rem; font-size: var(--fs-cap); color: var(--fg);
  font-family: var(--mono); letter-spacing: .01em;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--bad); flex: none;
       box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 16%, transparent); }
.dot.up { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 16%, transparent); }

/* ---- empty states ---------------------------------------------------------- */
.empty, .empty-inline { color: var(--dim); text-align: center; line-height: 1.55; }
.empty { padding: 3.2rem 1.2rem; font-size: var(--fs-meta); }
.empty-inline { padding: 1.1rem; font-size: var(--fs-meta); }

/* ---- throttling gauges ----------------------------------------------------- */
.tgauge { margin: 0 0 1rem; }
.tgauge:last-child { margin-bottom: 0; }
.tg-lbl { display: flex; justify-content: space-between; gap: .5rem; flex-wrap: wrap;
          font-size: var(--fs-meta); font-weight: 600; }
.tg-lbl > span:first-child { text-transform: uppercase; letter-spacing: .06em; }
.tg-num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 700; color: var(--fg); }
.hot   { color: var(--warn); }
.cold  { color: var(--info); }
.ok-c  { color: var(--ok); }
.bar {
  height: 9px; background: var(--panel2); border-radius: 999px; overflow: hidden;
  margin: .4rem 0 .35rem; border: 1px solid var(--line);
  box-shadow: inset 0 1px 2px rgba(0,0,0,.35);
}
.bar > i {
  display: block; height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--copper-deep), var(--copper) 70%, var(--copper-hi));
  box-shadow: 0 0 10px var(--copper-glow);
}
/* sparklines rendered as fine spun thread */
svg.spark { width: 100%; height: 32px; display: block; margin-top: .3rem;
            filter: drop-shadow(0 1px 3px color-mix(in srgb, var(--copper) 22%, transparent)); }
svg.spark path { stroke-linecap: round; stroke-linejoin: round; }
svg.tchart { width: 100%; height: auto; max-width: 540px; display: block; margin: .3rem auto .55rem; }
.tlegendrow { display: flex; flex-wrap: wrap; gap: .3rem .9rem; justify-content: center;
              font-size: var(--fs-meta); }
.tleg { display: inline-flex; align-items: center; gap: .3rem; font-weight: 600; white-space: nowrap; }
.tleg > i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: 0 0 auto; }
.tleg b { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.usagectl { display: flex; flex-wrap: wrap; gap: .4rem .5rem; align-items: center; margin: .1rem 0 .6rem; font-size: var(--fs-meta); }
.usagectl button { background: var(--panel2); border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: .25rem .6rem; cursor: pointer; font: inherit; }
.usagectl button.active { border-color: var(--copper); background: color-mix(in srgb, var(--copper) 12%, transparent); }
.usagectl input[type=date] { background: var(--panel2); border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: .18rem .4rem; font: inherit; color-scheme: dark; }
.usagectl .sp { flex: 1 1 8px; }
svg.uchart { width: 100%; height: auto; max-width: 920px; display: block; margin: .2rem 0 .3rem; }

/* ============================================================================
   SIGNATURE — the stage bar as THREAD WOUND ON A SPINDLE
   Markup is untouched: .stages > i(.done|.cur|·). Purely restyled here.
   done = copper coil wraps · cur = glowing winder · rest = bare bobbin shaft.
   ============================================================================ */
.stages {
  position: relative; display: flex; gap: 2px; height: 13px;
  margin: .55rem 4px .45rem; padding: 0 1px;
  background:
    linear-gradient(180deg, color-mix(in srgb, #000 30%, var(--panel2)), var(--panel2));
  border-radius: 3px;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.5);
}
/* bobbin flanges at each end */
.stages::before, .stages::after {
  content: ""; position: absolute; top: -3px; bottom: -3px; width: 3px; border-radius: 2px;
  background: linear-gradient(180deg, var(--copper-deep), color-mix(in srgb, var(--copper-deep) 40%, #000));
}
.stages::before { left: -5px; }
.stages::after  { right: -5px; }

.stages > i {
  flex: 1; border-radius: 1px; background: transparent; position: relative;
  border-top: 1px solid color-mix(in srgb, #fff 4%, transparent);
}
/* wound copper thread — fine coil striping reads as individual wraps */
.stages > i.done {
  background:
    repeating-linear-gradient(90deg,
      var(--copper) 0 2px,
      color-mix(in srgb, var(--copper-deep) 80%, var(--copper)) 2px 4px);
  box-shadow: inset 0 -2px 3px rgba(0,0,0,.35), inset 0 1px 1px var(--copper-hi);
}
/* the live winding point */
.stages > i.cur {
  background: linear-gradient(90deg, var(--copper) 0, var(--copper-hi) 100%);
  box-shadow: 0 0 10px var(--copper-glow), inset 0 1px 1px var(--copper-hi);
}
.stages > i.cur::after {
  content: ""; position: absolute; top: 50%; right: -2px; width: 6px; height: 6px;
  border-radius: 50%; transform: translateY(-50%);
  background: var(--copper-hi);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--copper) 30%, transparent), 0 0 9px var(--copper);
  animation: winder 2.4s ease-in-out infinite;
}

/* ---- context gauge --------------------------------------------------------- */
.gauge {
  height: 8px; background: var(--panel2); border-radius: 999px; overflow: hidden;
  border: 1px solid var(--line); margin: .35rem 0;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.35);
}
.gauge > div { height: 100%; border-radius: 999px;
               background: linear-gradient(90deg, color-mix(in srgb, var(--ok) 70%, #000), var(--ok)); }
.gauge.warn > div { background: linear-gradient(90deg, color-mix(in srgb, var(--warn) 70%, #000), var(--warn)); }
.gauge.bad  > div { background: linear-gradient(90deg, color-mix(in srgb, var(--bad) 70%, #000), var(--bad)); }

/* ---- fleet tiles ----------------------------------------------------------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(252px, 1fr)); gap: .8rem; }
.tile {
  position: relative; overflow: hidden; --tc: var(--info);
  background: linear-gradient(180deg, color-mix(in srgb, var(--fg) 2.5%, var(--panel)) 0, var(--panel) 42%);
  border: 1px solid var(--line); border-radius: var(--r); padding: .85rem .95rem .9rem 1.05rem;
  cursor: pointer; box-shadow: var(--sh);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
/* status accent strip down the spine of the tile */
.tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--tc); }
.tile:has(.status.done), .tile:has(.status.success) { --tc: var(--ok); }
.tile:has(.status.waiting), .tile:has(.status.interrupted), .tile:has(.status.subfencing) { --tc: var(--warn); }
.tile:has(.status.idle), .tile:has(.status.queued) { --tc: var(--dim); }
.tile:has(.status.error), .tile:has(.stall) { --tc: var(--bad); }
.tile:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--copper) 45%, var(--line)); box-shadow: var(--sh-lift); }
.tile h3 {
  margin: 0 0 .35rem; font-size: var(--fs-lead); color: var(--fg); font-family: var(--mono);
  text-transform: none; letter-spacing: .01em; font-weight: 700;
  display: flex; justify-content: space-between; align-items: center; gap: .5rem;
}
.tile h3::before { content: none; }
.tile .meta { color: var(--dim); font-size: var(--fs-meta); margin-bottom: .1rem; text-transform: capitalize; }

/* status pill — one custom prop drives colour, border, tint */
.status {
  --sc: var(--dim);
  font-size: 10px; padding: .12rem .55rem; border-radius: 999px;
  text-transform: uppercase; letter-spacing: .07em; font-weight: 700; white-space: nowrap;
  color: var(--sc);
  border: 1px solid color-mix(in srgb, var(--sc) 45%, var(--line));
  background: color-mix(in srgb, var(--sc) 14%, transparent);
}
.status.busy, .status.building, .status.planning { --sc: var(--info); }
.status.idle, .status.queued { --sc: var(--dim); }
.status.waiting, .status.interrupted, .status.subfencing { --sc: var(--warn); }
.status.error { --sc: var(--bad); }
.status.done, .status.success { --sc: var(--ok); }

.hb {
  font-size: var(--fs-cap); color: var(--dim); margin-top: .4rem;
  font-family: var(--mono); font-variant-numeric: tabular-nums; line-height: 1.5;
}
.stall {
  color: var(--bad); font-size: var(--fs-meta); margin-top: .45rem; font-weight: 800;
  letter-spacing: .04em; text-transform: uppercase;
}

/* ---- inbox cards ----------------------------------------------------------- */
.card {
  background: linear-gradient(180deg, color-mix(in srgb, var(--fg) 2.5%, var(--panel)) 0, var(--panel) 42%);
  border: 1px solid var(--line); border-left: 3px solid var(--warn);
  border-radius: var(--r); padding: .85rem .95rem; margin-bottom: .7rem; box-shadow: var(--sh);
}
.card.hold { border-left-color: var(--bad); }
.card h4 { margin: 0 0 .3rem; font-size: var(--fs-lead); font-weight: 700; }
.card .meta { color: var(--dim); font-size: var(--fs-meta); }

/* ---- tables (unit / history) ----------------------------------------------- */
table { width: 100%; border-collapse: collapse; font-size: var(--fs-meta); }
th, td { text-align: left; padding: .34rem .55rem; border-bottom: 1px solid var(--line); }
th {
  color: var(--dim); font-weight: 700; font-size: var(--fs-eyebrow);
  text-transform: uppercase; letter-spacing: .1em;
}
tr:last-child td { border-bottom: none; }
td { font-variant-numeric: tabular-nums; }
td.num { font-family: var(--mono); text-align: right; color: var(--fg); }
.mm { color: var(--bad); font-weight: 800; }
.zero { color: color-mix(in srgb, var(--ok) 75%, var(--dim)); }

/* ---- feed lists ------------------------------------------------------------ */
.feed { list-style: none; margin: 0; padding: 0; }
.feed li {
  padding: .45rem 0 .45rem .9rem; border-bottom: 1px solid var(--line);
  font-size: var(--fs-meta); position: relative;
}
.feed li::before {
  content: ""; position: absolute; left: 0; top: .85rem; width: 5px; height: 5px;
  border-radius: 50%; background: color-mix(in srgb, var(--copper) 60%, var(--line));
}
.feed li:last-child { border-bottom: none; }
.feed b { color: var(--fg); font-weight: 700; }

/* ---- buttons / unit picker ------------------------------------------------- */
.act {
  background: var(--panel2); border: 1px solid var(--line); color: var(--fg);
  border-radius: var(--r-sm); padding: .38rem .8rem; cursor: pointer;
  font-family: var(--mono); font-size: var(--fs-meta); font-weight: 600;
  transition: border-color .16s ease, color .16s ease, background .16s ease;
}
.act:hover { border-color: color-mix(in srgb, var(--copper) 55%, var(--line)); color: var(--copper); }
.pick { display: flex; gap: .45rem; flex-wrap: wrap; margin-bottom: .9rem; }
.unit-head { display: flex; align-items: center; gap: .7rem; margin-bottom: .35rem; flex-wrap: wrap; }
.unit-head h2 { margin: 0; }

footer {
  text-align: center; color: var(--dim); font-size: var(--fs-cap);
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  letter-spacing: .04em; padding: 1.2rem .8rem 2.4rem;
}

/* ---- Models tab : reuses the loom vocabulary (wells, gauges, threads) ------- */
.mcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(224px, 1fr)); gap: .8rem; }
.mcard {
  position: relative; overflow: hidden; --tc: var(--info);
  background: linear-gradient(180deg, color-mix(in srgb, var(--fg) 2.5%, var(--panel)) 0, var(--panel) 42%);
  border: 1px solid var(--line); border-radius: var(--r); padding: .85rem .95rem .9rem 1.05rem; box-shadow: var(--sh);
}
.mcard.codex  { --tc: var(--copper); }
.mcard.claude { --tc: var(--info); }
.mcard.glm    { --tc: var(--glm); }
.mcard.deepseek { --tc: var(--deepseek); }
.mcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--tc); }
.mcard-h { display: flex; justify-content: space-between; align-items: center; gap: .5rem; margin-bottom: .35rem; }
.mname { font-family: var(--mono); font-weight: 700; font-size: var(--fs-lead); text-transform: uppercase; letter-spacing: .03em; }
.mbig {
  font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 750;
  font-size: 26px; line-height: 1.05; display: flex; align-items: baseline; gap: .55ch; color: var(--fg);
}
.mbig .munit { font-family: var(--disp); font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }
.mbig.hot { color: var(--warn); } .mbig.cold { color: var(--info); } .mbig.ok-c { color: var(--ok); }
.mstats { display: flex; flex-wrap: wrap; gap: .25rem .9rem; font-size: var(--fs-cap); color: var(--dim); margin: .45rem 0 .15rem; }
.mstats b { color: var(--fg); font-variant-numeric: tabular-nums; font-family: var(--mono); }
.fam {
  font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700;
  padding: .12rem .5rem; border-radius: 999px; border: 1px solid; white-space: nowrap;
}
.fam.codex  { color: var(--copper); border-color: color-mix(in srgb, var(--copper) 45%, var(--line)); background: color-mix(in srgb, var(--copper) 13%, transparent); }
.fam.claude { color: var(--info);   border-color: color-mix(in srgb, var(--info) 45%, var(--line));   background: color-mix(in srgb, var(--info) 13%, transparent); }
.fam.glm    { color: var(--glm);    border-color: color-mix(in srgb, var(--glm) 45%, var(--line));    background: color-mix(in srgb, var(--glm) 13%, transparent); }
.fam.deepseek { color: var(--deepseek); border-color: color-mix(in srgb, var(--deepseek) 45%, var(--line)); background: color-mix(in srgb, var(--deepseek) 13%, transparent); }
.fdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: .55ch; vertical-align: middle; flex: none; }
.fdot.codex { background: var(--copper); } .fdot.claude { background: var(--info); } .fdot.glm { background: var(--glm); } .fdot.deepseek { background: var(--deepseek); } .fdot.other { background: var(--dim); }
.fam-t.codex { color: var(--copper); } .fam-t.claude { color: var(--info); } .fam-t.glm { color: var(--glm); } .fam-t.deepseek { color: var(--deepseek); } .fam-t.other { color: var(--fg); }
.mono { font-family: var(--mono); }
.tscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tscroll table { min-width: max-content; }
.tscroll td.mono, .tscroll th { white-space: nowrap; }
/* weekly reset time — the copper thread accent makes it the prominent line */
.reset-at {
  font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: var(--fs-cap);
  font-weight: 700; color: var(--copper); letter-spacing: .01em; margin-top: .4rem;
}
.reset-read { font-size: 11px; margin-top: .1rem; }

/* ---- motion (persistent elements only — #view re-renders every 10s) -------- */
@keyframes beacon {
  0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent); }
  70%  { box-shadow: 0 0 0 6px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
@keyframes winder {
  0%, 100% { opacity: .65; transform: translateY(-50%) scale(.85); }
  50%      { opacity: 1;   transform: translateY(-50%) scale(1.1); }
}
@keyframes headerIn {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: no-preference) {
  header { animation: headerIn .5s ease both; }
}
@media (prefers-reduced-motion: reduce) {
  .conn.on .dot2, .stages > i.cur::after { animation: none; }
  * { scroll-behavior: auto; }
}

/* ---- focus (keyboard) ------------------------------------------------------ */
:focus-visible {
  outline: 2px solid var(--copper);
  outline-offset: 2px;
  border-radius: var(--r-xs);
}

/* ============================================================================
   SIGNATURE — ROUTING as a THREADED LOOM (the pipeline as a flowchart)
   A run is a warp thread strung L->R through stage stations; each seat is a
   node on the thread, colour = model family. Drag to pan, wheel to zoom to the
   cursor. The bed carries faint reed lines so the thread reads as woven warp.
   ============================================================================ */
.rflow-wrap {
  position: relative; height: clamp(360px, 60vh, 560px);
  border: 1px solid var(--line); border-radius: var(--r); overflow: hidden;
  background:
    radial-gradient(120% 130% at 18% -12%, color-mix(in srgb, var(--info) 8%, var(--panel2)) 0, var(--panel2) 62%),
    repeating-linear-gradient(90deg, transparent 0 47px, color-mix(in srgb, var(--line) 42%, transparent) 47px 48px);
  box-shadow: inset 0 1px 3px rgba(0,0,0,.42); cursor: grab; touch-action: none; user-select: none;
}
.rflow-wrap.grabbing { cursor: grabbing; }
.rflow-svg { width: 100%; height: 100%; display: block; }
.rflow-svg text { font-family: var(--mono); fill: var(--fg); pointer-events: none; }
.rf-stage-t { font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
  fill: var(--copper); font-family: var(--disp); }
.rf-stage-s { font-size: 9.5px; fill: var(--dim); font-family: var(--disp); }
.rf-stage-band { fill: color-mix(in srgb, var(--fg) 2.2%, transparent); stroke: var(--line); stroke-dasharray: 2 5; }
.rf-thread { fill: none; stroke: var(--copper); stroke-opacity: .6; stroke-linecap: round;
  filter: drop-shadow(0 0 3px color-mix(in srgb, var(--copper) 30%, transparent)); }
.rf-branch { fill: none; stroke-linecap: round; }
.rf-loop   { fill: none; stroke: var(--copper); stroke-opacity: .55; stroke-dasharray: 3 4; }
.rf-loop-t { font-size: 9px; fill: var(--copper); font-family: var(--disp); letter-spacing: .04em; }
.rf-node { cursor: default; }
.rf-node .rf-card { fill: color-mix(in srgb, var(--fg) 4%, var(--panel)); stroke: var(--line); stroke-width: 1;
  transition: stroke .15s ease, filter .15s ease; }
.rf-node .rf-strip { fill: var(--nc); }
.rf-node .rf-dot { fill: var(--nc); }
.rf-role  { font-size: 12px; font-weight: 700; fill: var(--fg); }
.rf-model { font-size: 10.5px; fill: var(--nc); font-weight: 600; }
.rf-eff   { font-size: 8.5px; fill: var(--dim); letter-spacing: .08em; text-transform: uppercase; }
.rf-node:hover .rf-card { stroke: color-mix(in srgb, var(--nc) 75%, var(--line));
  filter: drop-shadow(0 0 9px color-mix(in srgb, var(--nc) 45%, transparent)); }
.rflow-legend { position: absolute; left: .55rem; bottom: .5rem; display: flex; gap: .65rem; flex-wrap: wrap;
  align-items: center; background: color-mix(in srgb, var(--panel) 82%, transparent); backdrop-filter: blur(6px);
  border: 1px solid var(--line); border-radius: 999px; padding: .26rem .7rem; font-size: 10px; color: var(--dim); }
.rflow-legend span { display: inline-flex; align-items: center; white-space: nowrap; }
.rflow-legend i { width: 8px; height: 8px; border-radius: 50%; margin-right: .4ch; }
.rflow-ctl { position: absolute; right: .55rem; top: .55rem; display: flex; gap: .3rem; }
.rflow-ctl button { width: 27px; height: 27px; border-radius: var(--r-xs); border: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel) 84%, transparent); color: var(--fg); cursor: pointer;
  font-family: var(--mono); font-size: 14px; line-height: 1; display: grid; place-items: center;
  transition: border-color .15s ease, color .15s ease; }
.rflow-ctl button:hover { border-color: var(--copper); color: var(--copper); }
.rflow-hint { position: absolute; right: .6rem; bottom: .55rem; font-size: 9.5px; color: var(--dim);
  font-family: var(--disp); letter-spacing: .03em; pointer-events: none; }
@media (max-width: 560px) { .rflow-hint { display: none; } }

/* lead track (distinct top lane) + parallel brace + end cap */
.rf-lead-band { fill: color-mix(in srgb, var(--copper) 13%, var(--panel)); stroke: color-mix(in srgb, var(--copper) 48%, var(--line)); stroke-width: 1.2; }
.rf-lead-t { font-size: 12px; font-weight: 800; letter-spacing: .05em; fill: var(--copper); font-family: var(--disp); text-transform: uppercase; }
.rf-lead-s { font-size: 10px; fill: var(--dim); font-family: var(--mono); }
.rf-lead-tick { stroke: color-mix(in srgb, var(--copper) 38%, transparent); stroke-width: 1; stroke-dasharray: 2 5; fill: none; }
.rf-stage-band.par { fill: color-mix(in srgb, var(--copper) 4%, transparent); stroke: color-mix(in srgb, var(--copper) 28%, var(--line)); }
.rf-par-brace { fill: none; stroke: color-mix(in srgb, var(--copper) 60%, var(--line)); stroke-width: 1.4; stroke-linecap: round; }
.rf-par-t { font-size: 9px; fill: var(--copper); font-family: var(--disp); font-weight: 700; letter-spacing: .03em; }
.rf-cap-ok { font-size: 9.5px; fill: var(--ok); font-family: var(--disp); }

/* attached sub-block (e.g. BUILD's per-step checkpoint) — dashed, hangs off the stage band's bottom */
.rf-attach-tick { stroke: color-mix(in srgb, var(--copper) 30%, transparent); stroke-width: 1; stroke-dasharray: 2 4; fill: none; }
.rf-attach-band { fill: color-mix(in srgb, var(--copper) 3%, transparent); stroke: var(--line); stroke-dasharray: 2 4; }
.rf-attach-t     { font-size: 9.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; fill: var(--copper); font-family: var(--disp); }
.rf-attach-role  { font-size: 9.5px; font-family: var(--mono); }
.rf-attach-s     { font-size: 8.5px; fill: var(--dim); font-family: var(--disp); }

/* mobile vertical loom — stage cards, native scroll, explicit parallel groups */
.rflow-legend.static { position: static; margin-top: .6rem; display: inline-flex; backdrop-filter: none; }
.mloom { display: flex; flex-direction: column; gap: 0; }
.mcap { text-align: center; font-family: var(--mono); font-size: 11px; color: var(--dim); padding: .35rem; letter-spacing: .05em; }
.mcap.end { color: var(--ok); font-weight: 700; }
.mlead { border: 1px solid color-mix(in srgb, var(--copper) 48%, var(--line)); border-radius: var(--r); margin-bottom: .15rem;
  padding: .6rem .85rem; background: color-mix(in srgb, var(--copper) 11%, var(--panel)); box-shadow: inset 3px 0 0 var(--copper); }
.mlead-t { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--copper); }
.mlead-s { font-size: 11px; font-family: var(--mono); color: var(--dim); margin-top: .12rem; }
.mconn { width: 2px; height: 15px; margin: 0 auto; background: linear-gradient(var(--copper), color-mix(in srgb, var(--copper) 25%, transparent)); }
.mconn.dash { background: none; border-left: 2px dashed color-mix(in srgb, var(--copper) 45%, transparent); }
.mstage { border: 1px solid var(--line); background: linear-gradient(180deg, color-mix(in srgb, var(--fg) 2%, var(--panel)), var(--panel));
  border-radius: var(--r); padding: .55rem .75rem .65rem; box-shadow: var(--sh); }
.mstage.support { border-style: dashed; opacity: .92; }
.mstage-h { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; }
.mstage-t { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--copper); }
.mtag { font-size: 9px; font-weight: 700; padding: .08rem .45rem; border-radius: 999px; letter-spacing: .02em; white-space: nowrap; }
.mtag.par { color: var(--copper); border: 1px solid color-mix(in srgb, var(--copper) 45%, var(--line)); background: color-mix(in srgb, var(--copper) 12%, transparent); }
.mtag.loop { color: var(--info); border: 1px solid color-mix(in srgb, var(--info) 45%, var(--line)); background: color-mix(in srgb, var(--info) 12%, transparent); }
.mstage-s { font-size: 10px; color: var(--dim); margin: .12rem 0 .45rem; }
.mseats { display: flex; flex-direction: column; gap: .35rem; }
.mseats.par { padding-left: .55rem; margin-left: .1rem; border-left: 2px solid color-mix(in srgb, var(--copper) 42%, var(--line)); }
.mseat { display: flex; justify-content: space-between; align-items: baseline; gap: .6rem;
  background: color-mix(in srgb, var(--fg) 3%, var(--panel2)); border-left: 3px solid var(--nc);
  border-radius: var(--r-xs); padding: .32rem .55rem; }
.mseat-role { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--fg); display: inline-flex; align-items: center; }
.mseat-model { font-family: var(--mono); font-size: 10px; color: var(--nc); text-align: right; }
.rf-par-t.seq { fill: var(--info); }
.mtag.seq { color: var(--info); border: 1px solid color-mix(in srgb, var(--info) 45%, var(--line)); background: color-mix(in srgb, var(--info) 12%, transparent); }
.mseats.spine { margin-bottom: .35rem; }
.mseats.spine .mseat { border-left-color: var(--copper); background: color-mix(in srgb, var(--copper) 9%, var(--panel2)); }
.mseats.seq { padding-left: .55rem; margin-left: .1rem; border-left: 2px dashed color-mix(in srgb, var(--info) 42%, var(--line)); }
.mseat-no { display: inline-block; min-width: 1.5em; margin-right: .45ch; padding: 0 .3em; border-radius: 999px; font-size: 9px; font-weight: 800;
  color: var(--copper); background: color-mix(in srgb, var(--copper) 14%, transparent); border: 1px solid color-mix(in srgb, var(--copper) 40%, var(--line)); text-align: center; }

/* mobile attached sub-block (mirrors .rf-attach-* on desktop) */
.mstage-attach  { margin-top: .5rem; padding: .4rem .55rem; border-radius: var(--r-xs);
  border: 1px dashed color-mix(in srgb, var(--copper) 40%, var(--line)); background: color-mix(in srgb, var(--copper) 4%, transparent); }
.mattach-h      { font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--copper); }
.mattach-role   { font-family: var(--mono); font-size: 11px; font-weight: 700; margin-top: .15rem; color: var(--nc); }
.mattach-model  { color: var(--dim); font-weight: 500; }
.mattach-s      { font-size: 9.5px; color: var(--dim); margin-top: .15rem; }

/* ---- narrow phones (~360px) ------------------------------------------------ */
@media (max-width: 380px) {
  main { padding: .7rem; }
  header { gap: .5rem; padding: .5rem .6rem; }
  .logo { font-size: 13px; letter-spacing: .06em; }
  nav button { padding: .3rem .5rem; font-size: 11px; }
  .tiles, .mcards { grid-template-columns: 1fr; }
  h2 { font-size: 18px; }
}

.projstrip{display:flex;gap:6px;padding:4px 14px 8px;flex-wrap:wrap}
.projbtn{background:transparent;border:1px solid var(--line,#333);border-radius:14px;
  padding:2px 12px;font:inherit;color:inherit;cursor:pointer;opacity:.65}
.projbtn.active{opacity:1;border-color:var(--acc,#7ee787)}
.projct{margin-left:6px;font-size:.85em;opacity:.8}
</style>
</head>
<body>
<header>
  <span class="logo">🧵 SPINDLE</span>
  <nav id="tabs">
    <button data-tab="pm" class="active">PM</button>
    <button data-tab="fleet">Fleet</button>
    <button data-tab="models">Models</button>
    <button data-tab="inbox">Inbox <span id="inbox-badge" class="badge" hidden></span></button>
    <button data-tab="unit">Unit</button>
    <button data-tab="history">History</button>
    <button data-tab="usage">Usage</button>
  </nav>
  <div id="proj-strip" class="projstrip" hidden></div>
  <nav hidden>
  </nav>
  <span id="conn" class="conn"><span class="dot2"></span><span id="conn-txt">connecting…</span></span>
</header>
<main id="view"></main>
<footer id="foot"></footer>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const view = $('#view');
const STAGES = ["queued","planning","interviewing","building","subfencing","phase-4 review","merge+cleanup","done"];

let RAW = null, SNAP = null, tab = 'pm', currentUnit = null;
let PROJ = localStorage.getItem('spindle.proj') || 'outbound';
function deriveSnap() {
  if (!RAW) { SNAP = null; return; }
  if (RAW.schema === 2 && RAW.projects) {
    const names = Object.keys(RAW.projects);
    if (!names.includes(PROJ)) PROJ = names[0];
    SNAP = Object.assign({}, RAW.projects[PROJ],
      { published_at: RAW.published_at, snapshot_id: RAW.snapshot_id, throttling: RAW.throttling });
  } else { SNAP = RAW; }
  renderProjStrip();
}
function projCounts(sec) {
  const us = (sec && sec.units) || [];
  const live = us.filter(u => u.stage && u.stage !== 'done' && u.stage !== 'queued').length;
  const gates = (sec && sec.gate_alert) ? 1 : 0;
  return { live, gates };
}
function renderProjStrip() {
  const el = document.getElementById('proj-strip');
  if (!el) return;
  if (!RAW || RAW.schema !== 2 || !RAW.projects) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = Object.keys(RAW.projects).map(n => {
    const c = projCounts(RAW.projects[n]);
    return `<button class="projbtn${n === PROJ ? ' active' : ''}" data-proj="${n}">` +
      `${n}<span class="projct">${c.live}▶${c.gates ? ' ⚠' : ''}</span></button>`;
  }).join('');
  // unified-PM status chips (owner 2026-08-17): attendance · PM session · sterling · per-fleet repl/bridge/monitor
  if (RAW.pm) {
    const pm = RAW.pm, att = (pm.attendance && pm.attendance.mode) || 'unknown';
    const chip = (txt, ok) => `<span class="projct" style="margin-left:6px;padding:2px 7px;border-radius:9px;background:${ok ? 'rgba(46,160,67,.25)' : 'rgba(248,81,73,.3)'}">${txt}</span>`;
    let html = chip(`watch: ${att}`, att === 'attended')
             + chip(pm.pm_session && pm.pm_session.fresh ? 'PM on' : 'PM off', !!(pm.pm_session && pm.pm_session.fresh))
             + chip('sterling', !!pm.sterling_up);
    (pm.fleets || []).forEach(f => {
      const ok = f.repl_up && f.bridge_up;
      const mon = (f.monitor_last_pass_min >= 0 && f.monitor_last_pass_min < 45) ? '·mon' : '';
      html += chip(`${f.fleet.slice(0,2)} ${f.repl_up ? 'repl' : 'REPL✗'}${f.bridge_up ? '' : ' br✗'}${mon}`, ok);
    });
    el.innerHTML += `<span style="display:inline-flex;align-items:center;flex-wrap:wrap">${html}</span>`;
  }
  el.querySelectorAll('[data-proj]').forEach(b => b.onclick = () => {
    PROJ = b.dataset.proj; localStorage.setItem('spindle.proj', PROJ);
    currentUnit = null; deriveSnap(); render();
  });
}

// ---- helpers --------------------------------------------------------------------------------
const escp = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
const escq = (s) => String(s ?? '').replace(/"/g, '&quot;');
function toEpoch(v) {
  if (v == null) return null;
  if (typeof v === 'number') return v;
  const p = Date.parse(v);
  return isNaN(p) ? null : p / 1000;
}
function ago(v) {
  const t = toEpoch(v);
  if (t == null) return '—';
  const s = Math.max(0, Date.now() / 1000 - t);
  if (s < 90) return Math.round(s) + 's';
  if (s < 5400) return Math.round(s / 60) + 'm';
  if (s < 172800) return (s / 3600).toFixed(1) + 'h';
  return Math.round(s / 86400) + 'd';
}
function gaugeClass(pct) {
  if (pct == null) return '';
  return pct >= 90 ? 'bad' : pct >= 75 ? 'warn' : '';
}
// weekly reset time (rendered verbatim from the snapshot — never recomputed) + data-freshness
function resetLine(g) {
  const read = `<div class="dim reset-read">read ${ago(g.at)} ago</div>`;
  return g.reset
    ? `<div class="reset-at">↻ resets · ${escp(g.reset)}</div>${read}`
    : read;
}
function emptyState(msg) { return `<div class="empty">${escp(msg)}</div>`; }
function spark(pts, target) {
  if (!pts || pts.length < 2) return '';
  const w = 300, h = 30, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const tgt = target || 0;
  const y0 = Math.min(...ys, tgt * 0.5), y1 = Math.max(...ys, tgt * 1.3 || 1);
  const X = (t) => ((t - x0) / (x1 - x0 || 1) * w).toFixed(1);
  const Y = (v) => (h - 4 - (v - y0) / (y1 - y0 || 1) * (h - 8)).toFixed(1);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]) + ',' + Y(p[1])).join(' ');
  const tgtLine = target ? `<line x1="0" x2="${w}" y1="${Y(tgt)}" y2="${Y(tgt)}" stroke="var(--dim)" stroke-opacity=".4" stroke-dasharray="3 4"/>` : '';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${tgtLine}<path d="${line}" fill="none" stroke="var(--purple)" stroke-width="1.6"/></svg>`;
}

// ---- PM tab -----------------------------------------------------------------------------------
function shortReset(r) { return (r || '').split('(')[0].replace(':00', '').trim(); }
function throttlingChart(th) {
  th = th || {};
  const series = [];
  if (th.codex) series.push(Object.assign({ name: 'codex', color: '#3FB8C4' }, th.codex));
  (th.claude || []).forEach((c, i) => series.push(Object.assign(
    { name: 'claude ' + (c.label || ''), color: ['#EA8B57', '#F0B07E', '#B85C22'][i] || '#EA8B57' }, c)));
  if (th.glm) series.push(Object.assign({ name: 'glm', color: '#A78BFA' }, th.glm));
  if (!series.some(s => (s.trail || []).length)) return null;   // no trail data -> caller falls back to gauges

  const M = { l: 24, r: 9, t: 9, b: 22 }, W = 260, H = 210;
  const PW = W - M.l - M.r, PH = H - M.t - M.b;
  const X = e => M.l + Math.max(0, Math.min(100, e)) / 100 * PW;
  const Y = u => M.t + PH - Math.max(0, Math.min(105, u)) / 105 * PH;
  let grid = '';
  [0, 25, 50, 75, 100].forEach(v => {
    grid += `<line x1="${X(0)}" y1="${Y(v)}" x2="${X(100)}" y2="${Y(v)}" stroke="var(--line)" stroke-opacity=".55"/>`;

  });

  let lbl = '';
  [0, 50, 100].forEach(v => {
    lbl += `<text x="${X(v)}" y="${Y(0) + 12}" fill="var(--dim)" font-size="7.5" text-anchor="middle">${v}</text>`;

  lbl += `<text x="${X(78)}" y="${Y(88)}" fill="var(--dim)" font-size="6.5" opacity=".8" transform="rotate(-33 ${X(78)} ${Y(88)})">ideal</text>`;
  let marks = '';

      marks += `<path d="${d}" fill="none" stroke="${sr.color}" stroke-width="1" stroke-opacity=".4" stroke-linejoin="round"/>`;
    }

      `<title>${escp(sr.name)} — used ${sr.used}% at elapsed ${now[0]}% (proj ${sr.projected}%)</title></circle>`;

  const leg = series.map(s => `<span class="tleg"><i style="background:${s.color}"></i>${escp(s.name)}` +
    `${s.mult ? ` <span class="dim">${escp(s.mult)}</span>` : ''} <b class="${cls(s)}">${s.used}%</b>` +
    `<span class="dim">·proj ${s.projected}%${s.reset ? ` ·↻ ${escp(shortReset(s.reset))}` : ''}</span></span>`).join('');

// DeepSeek is a spend-down USD BALANCE, not a %used-vs-target weekly pool (no reset, no target) —

// ---- History ------------------------------------------------------------------------------
let USAGE = (() => { try { return JSON.parse(localStorage.getItem('spindle.usage')) || {}; } catch (e) { return {}; } })();
if (!USAGE.span) USAGE.span = 7 * 86400;
if (!USAGE.mode) USAGE.mode = 'span';
function saveUsage() { try { localStorage.setItem('spindle.usage', JSON.stringify(USAGE)); } catch (e) {} }
function usageWindow() {
  const now = Date.now() / 1000;
  if (USAGE.mode === 'custom' && USAGE.min && USAGE.max) return [USAGE.min, USAGE.max];
  const end = USAGE.end || now;
  return [end - USAGE.span, Math.min(end, now)];
}
function usageChart(series, t0, t1) {
  const M = { l: 27, r: 11, t: 10, b: 26 }, W = 920, Ht = 300;
  const PW = W - M.l - M.r, PH = Ht - M.t - M.b, span = (t1 - t0) || 1;
  const X = t => M.l + (t - t0) / span * PW;
  const Y = u => M.t + PH - Math.max(0, Math.min(100, u)) / 100 * PH;
  let grid = '';
  [0, 25, 50, 75, 100].forEach(v => {
    grid += `<line x1="${M.l}" y1="${Y(v)}" x2="${W - M.r}" y2="${Y(v)}" stroke="var(--line)" stroke-opacity=".5"/>`;
    grid += `<text x="${M.l - 4}" y="${Y(v) + 2.6}" fill="var(--dim)" font-size="8" text-anchor="end">${v}</text>`;
  });
  const ticks = 5; let xlab = '';
  for (let i = 0; i <= ticks; i++) {
    const t = t0 + span * i / ticks, x = X(t);
    grid += `<line x1="${x.toFixed(1)}" y1="${M.t}" x2="${x.toFixed(1)}" y2="${M.t + PH}" stroke="var(--line)" stroke-opacity=".28"/>`;
    xlab += `<text x="${x.toFixed(1)}" y="${Ht - 9}" fill="var(--dim)" font-size="8" text-anchor="middle">${new Date(t * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</text>`;
  }
  let paths = '';
  series.forEach(sr => {
    const pts = (sr.pts || []).filter(p => p[0] >= t0 && p[0] <= t1);
    if (!pts.length) return;
    if (pts.length > 1) {
      const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ');
      paths += `<path d="${d}" fill="none" stroke="${sr.color}" stroke-width="1.4" stroke-opacity=".92" stroke-linejoin="round"/>`;
    }
    const last = pts[pts.length - 1];
    paths += `<circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="2.4" fill="${sr.color}"/>`;
  });
  const leg = series.map(sr => `<span class="tleg"><i style="background:${sr.color}"></i>${escp(sr.name)}</span>`).join('');
  return `<svg class="uchart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="usage over time">${grid}${paths}${xlab}</svg><div class="tlegendrow">${leg}</div>`;
}
function renderUsage() {
  if (!SNAP) { view.innerHTML = emptyState('waiting for snapshot…'); return; }
  const H = (SNAP.throttling || {}).history || {};
  const series = [];
  if (H.codex) series.push({ name: 'codex', color: '#3FB8C4', pts: H.codex });
  if (H.claude) Object.keys(H.claude).sort().forEach((k, i) => series.push({ name: 'claude ' + k, color: ['#EA8B57', '#F0B07E', '#B85C22'][i] || '#EA8B57', pts: H.claude[k] }));
  if (H.glm) series.push({ name: 'glm', color: '#A78BFA', pts: H.glm });
  const hasData = series.some(s => (s.pts || []).length);
  const [t0, t1] = usageWindow();
  const dISO = t => new Date(t * 1000).toISOString().slice(0, 10);
  const mb = (lbl, sp) => `<button data-span="${sp}" class="${(USAGE.mode === 'span' && !USAGE.end && USAGE.span === sp) ? 'active' : ''}">${lbl}</button>`;
  const ctl = `<div class="usagectl">${mb('24h', 86400)}${mb('7d', 7 * 86400)}${mb('30d', 30 * 86400)}` +
    `<button data-nav="back" title="earlier">←</button><button data-nav="fwd" title="later">→</button>` +
    `<span class="sp"></span><span class="dim">from</span><input type="date" data-d="min" value="${dISO(t0)}">` +
    `<span class="dim">to</span><input type="date" data-d="max" value="${dISO(t1)}"></div>`;
  const chart = hasData ? usageChart(series, t0, t1) : '<div class="empty-inline">no usage history in this snapshot</div>';
  view.innerHTML = `<div class="panel"><h3>Usage over time <span class="dim" style="font-weight:400">· used % · weekly resets show as drops</span></h3>${ctl}${chart}</div>`;
  view.querySelectorAll('[data-span]').forEach(b => b.onclick = () => { USAGE.span = +b.dataset.span; USAGE.end = null; USAGE.mode = 'span'; saveUsage(); render(); });
  view.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => {
    const w = usageWindow(), sp = w[1] - w[0], now = Date.now() / 1000;
    let end = USAGE.end || (USAGE.mode === 'custom' ? w[1] : now);
    if (USAGE.mode === 'custom') { USAGE.mode = 'span'; USAGE.span = sp; }
    end += (b.dataset.nav === 'fwd' ? sp : -sp);
    USAGE.end = Math.min(end, now); saveUsage(); render();
  });
  view.querySelectorAll('[data-d]').forEach(inp => inp.onchange = () => {
    const w = usageWindow(); let mn = w[0], mx = w[1];
    const v = Date.parse(inp.value + 'T00:00:00Z') / 1000;
    if (!isNaN(v)) { if (inp.dataset.d === 'min') mn = v; else mx = v + 86399; }
    USAGE.mode = 'custom'; USAGE.min = Math.min(mn, mx); USAGE.max = Math.max(mn, mx); saveUsage(); render();
  });
}
function renderHistory() {
  if (!SNAP) { view.innerHTML = emptyState('waiting for snapshot…'); return; }

    attach:{ role:'build.checkpoint_confirm', t:'per-step checkpoint', s:'find → glm-5.3 (default, every rung) · declare → codex, rung-scaled' } },

// classify a stage's seats by REAL concurrency: parallel fleet vs sequential rounds vs a lead spine.
function stageInfo(st, seats) {
  if (st.flow === 'coplan') { const spine = seats.find(p => rfShort(p.role) === st.spine) || null;
    const fan = seats.filter(p => p !== spine); return { tag:`∥ ${fan.length} co-drafters (parallel)`, spine, fan, seq:[], par:true }; }
  if (st.flow === 'sequence') return { tag:`↻ ${seats.length} rounds · in order`, spine:null, fan:[], seq:seats, par:false };
  if (st.flow === 'roles')    return { tag:`${seats.length} per-step roles`, spine:null, fan:seats, seq:[], par:false };
  if (st.flow === 'parallel') return { tag: seats.length>1 ? `∥ ${seats.length} parallel` : '', spine:null, fan:seats, seq:[], par:true };
  return { tag:'', spine:null, fan:seats, seq:[], par:false };
}
const RF_SUPPORT = { id:'support', t:'On-demand', s:'auto-mode proxies · consult', roles:['auto_proxy','auto_questionnaire_proxy','consult.codex'] };
let RFLOW = { k:1, x:0, y:0 };

function modelInfo(model) {
  const m = String(model || '').toLowerCase();
  if (m.includes('fable'))  return { fam:'fable',  v:'--fable',  short:'fable-5' };
  if (m.includes('opus'))   return { fam:'claude', v:'--info',   short:'opus-4.8' };
  if (m.includes('sonnet')) return { fam:'claude', v:'--sonnet', short:'sonnet-4.6' };
  if (m.includes('sol'))    return { fam:'codex',  v:'--sol',    short:'sol' };
  if (m.includes('terra'))  return { fam:'codex',  v:'--copper', short:'terra' };
  if (m.includes('gpt'))    return { fam:'codex',  v:'--copper', short:m.replace('gpt-','') };
  if (m.includes('glm'))    return { fam:'glm',    v:'--glm',    short:m || 'glm-5.3' };
  if (m.includes('deepseek')) return { fam:'deepseek', v:'--deepseek', short:m || 'deepseek-chat' };
  return { fam:'other', v:'--dim', short:m || '—' };
}

// static hover-annotations for seats whose flattened policy value hides a rung-scaled/GLM-overlaid

// DESKTOP loom: SVG in NATURAL px (no viewBox fit) so nodes are readable at 1:1;
// the rf-cam transform (RFLOW) pans/zooms in those same px. Lead = a distinct top
// track; parallel stages get a brace + "∥ N parallel" tag.
function buildLoom(phases) {
  const byRole = {}; (phases||[]).forEach(p => { byRole[String(p.role||'').replace(/^hultra\./,'')] = p; });
  const leadP = byRole['lead'];
  const COLW=216, NW=170, NH=48, STEP=64, X0=40, LEADY=12, LEADH=44;
  const stages = RF_STAGES.filter(st => st.id!=='lead')
    .map(st => ({...st, seats: st.roles.map(r=>byRole[r]).filter(Boolean)})).filter(st => st.seats.length);
  if (!stages.length) return null;
  const support = { ...RF_SUPPORT, seats: RF_SUPPORT.roles.map(r=>byRole[r]).filter(Boolean) };
  const maxSeats = Math.max(1, ...stages.map(s=>s.seats.length));
  const halfH = (maxSeats-1)*STEP/2;
  const HDR = LEADY + LEADH + 24;
  const spineY = HDR + 34 + halfH + NH/2;
  const supY = spineY + halfH + 96;
  stages.forEach((st,i) => { st.cx = X0 + NW/2 + i*COLW; });
  const last = stages[stages.length-1];
  const worldW = last.cx + NW/2 + 70, worldH = supY + NH/2 + 22;
  const under = [], over = [], nodes = [];

  if (leadP) {
    const mi = modelInfo(leadP.model), lx=X0-14, lw=worldW-lx-24, ly=LEADY;
    over.push(`<rect class="rf-lead-band" x="${lx}" y="${ly}" width="${lw}" height="${LEADH}" rx="11"/>`);
    over.push(`<circle class="rf-dot" cx="${lx+18}" cy="${ly+LEADH/2}" r="4" style="fill:var(${mi.v})"/>`);
    over.push(`<text class="rf-lead-t" x="${lx+32}" y="${ly+LEADH/2-1}">LEAD — orchestrates every stage</text>`);
    over.push(`<text class="rf-lead-s" x="${lx+32}" y="${ly+LEADH/2+14}">${escp(mi.short)} · ${escp(leadP.effort||'')}</text>`);
    stages.forEach(st => under.push(`<path class="rf-lead-tick" d="M${st.cx},${ly+LEADH} L${st.cx},${HDR+2}"/>`));
  }

  for (let i=0;i<stages.length-1;i++)
    under.push(`<path class="rf-thread" stroke-width="3" d="${rfCurve(stages[i].cx+NW/2+16, spineY, stages[i+1].cx-NW/2-16, spineY)}"/>`);
  under.push(`<path class="rf-thread" stroke-width="3" d="M${(stages[0].cx-NW/2-36).toFixed(1)},${spineY} L${(stages[0].cx-NW/2-16).toFixed(1)},${spineY}"/>`);
  under.push(`<path class="rf-thread" stroke-width="3" d="M${(last.cx+NW/2+16).toFixed(1)},${spineY} L${(last.cx+NW/2+46).toFixed(1)},${spineY}"/>`);
  over.push(`<text class="rf-stage-s" x="${(stages[0].cx-NW/2-40).toFixed(1)}" y="${spineY-8}" text-anchor="end">unit ▸</text>`);
  over.push(`<text class="rf-cap-ok" x="${(last.cx+NW/2+52).toFixed(1)}" y="${(spineY+4).toFixed(1)}">merged ✓</text>`);

  stages.forEach(st => {
    const cx=st.cx, n=st.seats.length, top=spineY-(n-1)*STEP/2;
    const ex=cx-NW/2-16, xx=cx+NW/2+16;
    const info = stageInfo(st, st.seats);
    over.push(`<rect class="rf-stage-band ${info.par?'par':''}" x="${cx-COLW/2+10}" y="${HDR-4}" width="${COLW-20}" height="${(maxSeats-1)*STEP+NH+34}" rx="11"/>`);
    over.push(`<text class="rf-stage-t" x="${cx}" y="${HDR+12}" text-anchor="middle">${escp(st.t)}</text>`);
    over.push(`<text class="rf-stage-s" x="${cx}" y="${HDR+26}" text-anchor="middle">${escp(st.s)}</text>`);
    if (info.tag) over.push(`<text class="rf-par-t ${info.par?'':'seq'}" x="${cx}" y="${HDR+38}" text-anchor="middle">${escp(info.tag)}</text>`);
    if (info.par && info.fan.length>1) {   // brace ONLY around the genuinely-parallel seats
      const fi=info.fan.map(p=>st.seats.indexOf(p)), lo=Math.min(...fi), hi=Math.max(...fi);
      const tY=top+lo*STEP-NH/2, bY=top+hi*STEP+NH/2, my=(tY+bY)/2, bx=cx-NW/2-22;
      over.push(`<path class="rf-par-brace" d="M${bx+7},${tY} Q${bx},${tY} ${bx},${tY+9} L${bx},${(my-6).toFixed(1)} M${bx},${(my+6).toFixed(1)} L${bx},${bY-9} Q${bx},${bY} ${bx+7},${bY}"/>`);
    }
    const seqNo={}; info.seq.forEach((p,i)=>{ seqNo[st.seats.indexOf(p)]=i+1; });
    st.seats.forEach((p,j) => {
      const y=top+j*STEP, mi=modelInfo(p.model);
      under.push(`<path class="rf-branch" style="stroke:var(${mi.v})" stroke-opacity=".34" stroke-width="1.5" d="${rfCurve(ex, spineY, cx-NW/2, y)}"/>`);
      under.push(`<path class="rf-branch" style="stroke:var(${mi.v})" stroke-opacity=".34" stroke-width="1.5" d="${rfCurve(cx+NW/2, y, xx, spineY)}"/>`);
      const badge = info.spine===p ? 'lead' : (seqNo[j] ? ('#'+seqNo[j]) : null);
      nodes.push(rfNode(cx-NW/2, y-NH/2, rfShort(p.role), mi, p.effort, badge, RF_SEAT_NOTE[p.role]));
    });
    if (st.loop) {
      const ty = top - NH/2 - 22;
      over.push(`<path class="rf-loop" stroke-width="1.6" d="M${xx.toFixed(1)},${spineY} C${(xx+16).toFixed(1)},${ty.toFixed(1)} ${(ex-16).toFixed(1)},${ty.toFixed(1)} ${ex.toFixed(1)},${spineY}"/>`);
      over.push(`<text class="rf-loop-t" x="${cx}" y="${(ty-4).toFixed(1)}" text-anchor="middle">↻ ${escp(st.loop)}</text>`);
    }
    if (st.attach) {
      const ap = byRole[st.attach.role];
      if (ap) {
        const mi2 = modelInfo(ap.model);
        const bandBottom = HDR - 4 + (maxSeats-1)*STEP + NH + 34;
        const ax = cx - COLW/2 + 10, ay = bandBottom + 14, aw = COLW - 20, ah = 46;
        under.push(`<path class="rf-attach-tick" d="M${cx},${bandBottom} L${cx},${ay}"/>`);
        const atitle = RF_SEAT_NOTE[ap.role];
        over.push(`<g class="rf-attach">
          <rect class="rf-attach-band" x="${ax}" y="${ay}" width="${aw}" height="${ah}" rx="9"/>
          <text class="rf-attach-t" x="${cx}" y="${ay+14}" text-anchor="middle">⚙ ${escp(st.attach.t)}</text>
          <text class="rf-attach-role" x="${cx}" y="${ay+28}" text-anchor="middle" style="fill:var(${mi2.v})">${escp(rfShort(ap.role))} · ${escp(mi2.short)} · ${escp(ap.effort||'')}</text>
          <text class="rf-attach-s" x="${cx}" y="${ay+40}" text-anchor="middle">${escp(st.attach.s)}</text>
          ${atitle ? `<title>${escp(st.attach.t)} — ${escp(atitle)}</title>` : ''}
        </g>`);
      }
    }
  });

  if (support.seats.length) {
    const cx=stages[0].cx;
    under.push(`<path class="rf-loop" stroke-opacity=".4" stroke-width="1.6" d="${rfCurve(cx, spineY+halfH+NH/2, cx, supY-46)}"/>`);
    over.push(`<text class="rf-stage-t" x="${cx}" y="${(supY-52).toFixed(1)}" text-anchor="middle">${escp(support.t)}</text>`);
    over.push(`<text class="rf-stage-s" x="${cx}" y="${(supY-38).toFixed(1)}" text-anchor="middle">${escp(support.s)}</text>`);
    support.seats.forEach((p,j) => { const x=X0+j*(NW+18); nodes.push(rfNode(x, supY-NH/2, rfShort(p.role), modelInfo(p.model), p.effort)); });
  }

  return `<svg class="rflow-svg" data-w="${worldW.toFixed(0)}" data-h="${worldH.toFixed(0)}" preserveAspectRatio="xMinYMin meet">
    <g class="rf-cam">${under.join('')}${over.join('')}${nodes.join('')}</g></svg>`;
}

    return `<div class="mseat" style="--nc:var(${mi.v})"${note?` title="${escp(note)}"`:''}>

  return `<div class="mloom">${lead}<div class="mcap start">unit ▸</div>${body}<div class="mconn"></div><div class="mcap end">merged ✓</div>${supHtml}</div>`;

function rfSvgPt(svg, cx, cy) {
  const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy;
  const m = svg.getScreenCTM(); if (!m) return { x:0, y:0 };
  const p = pt.matrixTransform(m.inverse()); return { x:p.x, y:p.y };
}
function rfApply(cam) { cam.setAttribute('transform', `translate(${RFLOW.x.toFixed(2)},${RFLOW.y.toFixed(2)}) scale(${RFLOW.k.toFixed(4)})`); }
function rfZoomTo(px, py, factor, svg, cam) {
  const p = rfSvgPt(svg, px, py);
  const wx = (p.x - RFLOW.x) / RFLOW.k, wy = (p.y - RFLOW.y) / RFLOW.k;
  const nk = Math.min(3.2, Math.max(0.4, RFLOW.k * factor));
  RFLOW.k = nk; RFLOW.x = p.x - wx*nk; RFLOW.y = p.y - wy*nk; rfApply(cam);
}
function wireLoom() {
  const wrap = document.querySelector('.rflow-wrap'); if (!wrap) return;
  const svg = wrap.querySelector('.rflow-svg'), cam = wrap.querySelector('.rf-cam'); if (!svg || !cam) return;
  const wW = +svg.dataset.w || 1000, wH = +svg.dataset.h || 400;
  if (!RFLOW.inited) {                       // default: fit to HEIGHT so nodes stay readable, start at the left
    const b = wrap.getBoundingClientRect();
    const k = Math.max(0.4, Math.min(1.15, (b.height - 22) / wH));
    RFLOW = { k, x: 16, y: Math.max(6, (b.height - wH*k) / 2), inited: true };
  }
  rfApply(cam);
  wrap.addEventListener('wheel', ev => {
    ev.preventDefault();
    const d = Math.max(-50, Math.min(50, ev.deltaY));
    rfZoomTo(ev.clientX, ev.clientY, Math.exp(-d * 0.0011), svg, cam);
  }, { passive:false });
  let drag = null;
  wrap.addEventListener('pointerdown', ev => { if (ev.button) return; drag = { sx:ev.clientX, sy:ev.clientY, ox:RFLOW.x, oy:RFLOW.y, s:(svg.getScreenCTM()||{a:1}).a || 1 };
    wrap.classList.add('grabbing'); try { wrap.setPointerCapture(ev.pointerId); } catch(_){} });
  wrap.addEventListener('pointermove', ev => { if (!drag) return; RFLOW.x = drag.ox + (ev.clientX-drag.sx)/drag.s; RFLOW.y = drag.oy + (ev.clientY-drag.sy)/drag.s; rfApply(cam); });
  const end = () => { drag = null; wrap.classList.remove('grabbing'); };
  wrap.addEventListener('pointerup', end); wrap.addEventListener('pointercancel', end); wrap.addEventListener('pointerleave', end);
  const c = () => wrap.getBoundingClientRect();
  const btn = (z) => wrap.querySelector(`[data-z="${z}"]`);
  if (btn('in'))  btn('in').onclick  = () => { const b=c(); rfZoomTo(b.left+b.width/2, b.top+b.height/2, 1.25, svg, cam); };
  if (btn('out')) btn('out').onclick = () => { const b=c(); rfZoomTo(b.left+b.width/2, b.top+b.height/2, 1/1.25, svg, cam); };
  if (btn('fit')) btn('fit').onclick = () => { const b=c(); const k=Math.max(0.4,Math.min(1.15,(b.height-22)/wH)); RFLOW={k,x:16,y:Math.max(6,(b.height-wH*k)/2),inited:true}; rfApply(cam); };
}

function familyOf(model) {

function burnCard(g) {
  const proj = g.projected ?? 0;
  const target = g.target;
  const cls = target ? (proj > target * 1.1 ? 'hot' : proj < target * 0.85 ? 'cold' : 'ok-c') : '';
  const fill = target ? Math.min(100, proj / target * 100) : 0;
  const room = target != null ? target - proj : null;
  const roomHtml = room == null ? ''
    : room < 0 ? `<span class="hot">over target by ${-room}</span>`
    : `<span class="${cls}">headroom ${room}</span>`;
  return `<div class="mcard ${g.fam}">
    <div class="mcard-h"><span class="mname">${escp(g.name)}${g.mult ? ` <span class="mult">(${escp(g.mult)})</span>` : ''}</span><span class="fam ${g.fam}">${escp(g.fam)}</span></div>
    <div class="mbig ${cls}">${proj}%<span class="munit">proj @ reset</span></div>
    <div class="bar" title="projected vs target"><i style="width:${fill}%"></i></div>
    <div class="mstats"><span>used <b>${g.used != null ? g.used + '%' : '—'}</b></span><span>target <b>${target ?? '—'}</b></span>${roomHtml}</div>
    ${spark(g.spark, g.target)}
    ${resetLine(g)}
  </div>`;
}
// DeepSeek variant of burnCard: a spend-down USD balance has no "% used vs target @ reset" — the

  const daysHtml = days != null ? `<span class="${cls}">days left ${days.toFixed(1)}</span>` : '<span class="dim">days left —</span>';
  const availHtml = g.available === false ? '<span class="bad">UNAVAILABLE</span>' : '';
  return `<div class="mcard deepseek">
    <div class="mcard-h"><span class="mname">deepseek</span><span class="fam deepseek">deepseek</span></div>
    <div class="mbig ${cls}">${escp(cur)} ${bal}<span class="munit">balance</span></div>
    <div class="bar" title="depletion (days-to-empty vs a 30-day horizon)"><i style="width:${fill}%"></i></div>
    <div class="mstats">${burnHtml}${daysHtml}${availHtml}</div>
    ${spark(g.spark, null)}
    ${resetLine(g)}
  </div>`;
}
function renderModels() {
  if (!SNAP) { view.innerHTML = emptyState('waiting for snapshot…'); return; }
  const th = SNAP.throttling || {};
  const accts = [];
  if (th.codex) accts.push({ name: 'codex', fam: 'codex', ...th.codex });
  (th.claude || []).forEach(c => accts.push({ name: 'claude ' + (c.label || ''), fam: 'claude', ...c }));
  if (th.glm) accts.push({ name: 'glm', fam: 'glm', ...th.glm });
  // th.codex / th.claude are per-account ARRAYS; th.glm / th.deepseek are single scalar objects.
  // deepseek is balance-shaped (no %used/target/reset) so it renders via dsBurnCard, not burnCard.
  if (th.deepseek) accts.push({ name: 'deepseek', fam: 'deepseek', ...th.deepseek });
  const burnHtml = accts.length
    ? `<div class="mcards">${accts.map(a => a.fam === 'deepseek' ? dsBurnCard(a) : burnCard(a)).join('')}</div>
       <div class="note">Headroom is target minus projected-at-reset — more headroom means more room before the weekly limit resets. Each card reads its own target from the snapshot. DeepSeek is pay-per-use (no weekly reset), so its card shows balance + burn-per-day + days-to-empty instead.</div>`
    : '<div class="empty-inline">no throttling readings in this snapshot</div>';

  const rt = SNAP.routing;
  let routingHtml;
  if (!rt || !(rt.phases || []).length) {
    routingHtml = `<div class="panel"><h3>Routing map</h3><div class="empty-inline">no routing published in this snapshot — the switchboard appears once the routing resolver reports in.</div></div>`;
  } else {
    const legendInner = `<span><i style="background:var(--info)"></i>opus</span><span><i style="background:var(--sonnet)"></i>sonnet</span><span><i style="background:var(--fable)"></i>fable</span><span><i style="background:var(--copper)"></i>terra · 5.5</span><span><i style="background:var(--sol)"></i>sol</span>`;
    const legend = `<div class="rflow-legend">${legendInner}</div>`;
    const isNarrow = window.matchMedia('(max-width: 720px)').matches;
    let loomHtml;
    if (isNarrow) {
      loomHtml = buildLoomMobile(rt.phases) + `<div class="rflow-legend static">${legendInner}</div>`;
    } else {
      const loomSvg = buildLoom(rt.phases);
      loomHtml = loomSvg
        ? `<div class="rflow-wrap">${loomSvg}
            <div class="rflow-ctl"><button data-z="in" title="zoom in" aria-label="zoom in">+</button><button data-z="out" title="zoom out" aria-label="zoom out">−</button><button data-z="fit" title="reset view" aria-label="reset view">⤢</button></div>
            ${legend}
            <div class="rflow-hint">drag to pan · scroll to zoom</div>
          </div>`
        : '<div class="empty-inline">no phases to map</div>';
    }

    const rev = rt.review || {};
    const tiers = rev.tiers || [];
    const tierRows = tiers.map(t => {
      const lens = t.claude_lens;
      return `<tr><td class="mono">${escp(t.tier)}</td>
        <td class="mono"><span class="fdot codex"></span><span class="fam-t codex">${escp(t.codex_model || '—')}</span></td>
        <td>${escp(t.profile || '—')}</td>
        <td class="num">${t.round_cap ?? '—'}</td>
        <td class="mono">${lens ? `<span class="fdot claude"></span><span class="fam-t claude">${escp(lens)}</span>` : '<span class="dim">—</span>'}</td>
        <td class="mono">${escp(t.lens_effort || '—')}</td></tr>`;
    }).join('');
    const tiersTable = tiers.length
      ? `<div class="tscroll"><table><tr><th>tier</th><th>codex</th><th>profile</th><th>cap</th><th>claude lens</th><th>lens eff</th></tr>${tierRows}</table></div>`
      : '<div class="empty-inline">no review tiers reported</div>';
    const revStats = `<div class="kv" style="margin-top:.6rem">
      <span>concurrency cap <b>${rev.concurrency_cap ?? '—'}</b></span>
      <span>fill model <b class="mono">${escp(rev.fill_model || '—')}</b></span>
      <span>spark pool <b class="mono">${escp(rev.spark || '—')}</b></span>
    </div>`;
    const note = `<div class="note">resolver: ${escp(rt.source || 'unknown')} — reflects the routing resolver's defaults; the latest hultra.md seat tweaks (fable co-plan, terra confirms, sol seats) may not appear here.</div>`;
    routingHtml = `<div class="panel"><h3>Routing · loom <span class="dim" style="text-transform:none;letter-spacing:0;font-weight:400">— the pipeline, threaded</span></h3>${loomHtml}</div>
      <div class="panel"><h3>Routing · review posture</h3>${tiersTable}${revStats}${note}</div>`;
  }

  view.innerHTML = `<div class="panel"><h3>Burn / headroom</h3>${burnHtml}</div>${routingHtml}`;
  if (SNAP.routing && (SNAP.routing.phases || []).length) wireLoom();
}

// ---- tab machinery + polling -----------------------------------------------------------------
const renderers = { pm: renderPM, fleet: renderFleet, models: renderModels, inbox: renderInbox, unit: renderUnit, history: renderHistory, usage: renderUsage };
function setTab(t) {
  tab = t;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  render();
}
function render() {
  try { renderers[tab](); }
  catch (e) { view.innerHTML = `<div class="empty">render error: ${escp(e.message)}</div>`; }
  renderFoot();
}
function renderFoot() {
  if (!SNAP) { $('#foot').textContent = ''; return; }
  const pa = SNAP.published_at ? ago(SNAP.published_at) + ' ago' : '—';
  $('#foot').textContent = `snapshot ${SNAP.snapshot_id || '—'} · published ${pa}`;
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => setTab(b.dataset.tab));

function setConn(ok) {
  const el = $('#conn');
  el.classList.toggle('on', ok);
  $('#conn-txt').textContent = ok ? 'live' : 'offline';
}

async function poll() {
  try {
    const res = await fetch('snapshot.json?t=' + Date.now(), { cache: 'no-store' });
    if (res.ok) { RAW = await res.json(); deriveSnap(); setConn(true); render(); }
    else setConn(false);
  } catch (e) { setConn(false); }
}
poll();
setInterval(poll, 10000);           // stay fresh — the publisher writes every ~5 min, we just poll faster
setInterval(() => { const a = document.activeElement; if (SNAP && !(a && view.contains(a) && /INPUT|SELECT/.test(a.tagName))) render(); }, 15000); // re-tick "ago" ages between polls
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { RFLOW.inited = false; if (SNAP && tab === 'models') render(); }, 200); });
</script>
</body>
</html>
